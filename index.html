<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Problema de las 3 Puertas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="contenedor">
    <h1>Problema de las 3 Puertas</h1>

    <p id="mensaje">Elige una puerta para comenzar.</p>

    <section class="estadisticas" aria-label="Estadísticas de partidas">
      <h2>Estadísticas</h2>
      <div class="marcador">
        <article><small>Partidas</small><strong id="partidas">0</strong></article>
        <article class="dato-ganadas"><small>Ganadas</small><strong id="ganadas">0</strong></article>
        <article class="dato-perdidas"><small>Perdidas</small><strong id="perdidas">0</strong></article>
        <article class="dato-exito"><small>Éxito</small><strong id="porcentaje">0%</strong></article>
      </div>
      <div class="estrategias">
        <article>
          <div><span>Al quedarse</span><strong id="quedarse-estadistica">0/0 (0%)</strong></div>
          <div class="barra"><span id="barra-quedarse"></span></div>
        </article>
        <article>
          <div><span>Al cambiar</span><strong id="cambiar-estadistica">0/0 (0%)</strong></div>
          <div class="barra"><span id="barra-cambiar"></span></div>
        </article>
      </div>
      <button id="reiniciar-estadisticas">Reiniciar estadísticas</button>
    </section>

    <div class="puertas">
      <button class="puerta" data-puerta="1"></button>
      <button class="puerta" data-puerta="2"></button>
      <button class="puerta" data-puerta="3"></button>
    </div>

    <div class="opciones">
      <button id="quedarse" disabled>Quedarme</button>
      <button id="cambiar" disabled>Cambiar</button>
    </div>

    <p id="resultado"></p>

    <button id="reiniciar">Jugar otra vez</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
